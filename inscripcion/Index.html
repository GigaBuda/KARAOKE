<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;background:#f1efff;color:#202124;font:16px Arial,sans-serif}.wrap{max-width:720px;margin:24px auto;padding:0 14px 32px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}header{border-top:9px solid #5b4be8;padding:24px}h1{margin:0 0 10px;font-size:28px;font-weight:500}.intro{margin:0}form{padding:4px 24px 24px}label{display:block;font-weight:600;margin:18px 0 8px}select,input{width:100%;padding:13px;border:1px solid #b8bbc0;border-radius:7px;background:white;font-size:16px}select:disabled{background:#f4f4f4;color:#777}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:24px;background:#5b4be8;color:white;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.hint{font-size:13px;color:#5f6368;margin:6px 0 0}.status{display:none;margin-top:16px;padding:12px;border-radius:8px}.status.ok{display:block;background:#e6f4ea;color:#137333}.status.err{display:block;background:#fce8e6;color:#b3261e}.req{color:#b3261e}@media(max-width:520px){.wrap{margin:12px auto;padding:0 8px 24px}header{padding:20px}form{padding:4px 20px 22px}h1{font-size:24px}}
</style></head><body><main class="wrap"><section class="card"><header><h1>🎤 Inscripciones Karaoke</h1><p class="intro">¡Apúntate, elige tu canción y prepárate para subir al escenario!</p></header>
<form id="signupForm">
<label for="language">Idioma <span class="req">*</span></label><select id="language" required><option value="">Cargando idiomas…</option></select>
<label for="artist">Cantante o autor <span class="req">*</span></label><select id="artist" required disabled><option value="">Primero elige un idioma</option></select><p class="hint">Los nombres se leen de la columna B.</p>
<label for="song">Canción <span class="req">*</span></label><select id="song" required disabled><option value="">Primero elige un cantante</option></select><p class="hint">Las canciones se leen de la columna D y se filtran por cantante.</p>
<label for="singerName">Nombre de la persona que va a cantar <span class="req">*</span></label><input id="singerName" maxlength="120" required placeholder="Escribe tu nombre">
<button id="submitButton" type="submit">Enviar inscripción</button><div id="status" class="status" role="status"></div>
</form></section></main>
<script>
let catalog={};const lang=document.getElementById('language'),artist=document.getElementById('artist'),song=document.getElementById('song'),form=document.getElementById('signupForm'),btn=document.getElementById('submitButton'),statusBox=document.getElementById('status');
function fill(sel,placeholder,items){sel.replaceChildren();const first=document.createElement('option');first.value='';first.textContent=placeholder;sel.appendChild(first);(items||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});sel.disabled=!(items&&items.length)}
function showStatus(msg,type){statusBox.textContent=msg;statusBox.className='status '+type}
google.script.run.withSuccessHandler(data=>{catalog=data||{};fill(lang,'Elige un idioma',Object.keys(catalog));Array.from(lang.options).forEach(o=>{if(o.value)o.textContent=catalog[o.value].label})}).withFailureHandler(e=>showStatus(e.message||String(e),'err')).getCatalog();
lang.addEventListener('change',()=>{const d=catalog[lang.value];fill(artist,d?'Elige un cantante':'Primero elige un idioma',d?d.artists:[]);fill(song,'Primero elige un cantante',[]);statusBox.className='status'});
artist.addEventListener('change',()=>{const d=catalog[lang.value],songs=d&&d.songsByArtist[artist.value]?d.songsByArtist[artist.value]:[];fill(song,songs.length?'Elige una canción':'No hay canciones para este cantante',songs);statusBox.className='status'});
form.addEventListener('submit',e=>{e.preventDefault();btn.disabled=true;btn.textContent='Enviando…';const payload={language:lang.value,artist:artist.value,song:song.value,singerName:document.getElementById('singerName').value.trim()};google.script.run.withSuccessHandler(r=>{showStatus(r.message||'Inscripción registrada.','ok');form.reset();fill(artist,'Primero elige un idioma',[]);fill(song,'Primero elige un cantante',[]);btn.disabled=false;btn.textContent='Enviar inscripción'}).withFailureHandler(err=>{showStatus(err.message||String(err),'err');btn.disabled=false;btn.textContent='Enviar inscripción'}).submitSignup(payload)});
</script></body></html>
